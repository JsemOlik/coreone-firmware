# Prusa CORE One L / L+ -- bring-up config for the xBuddy (F427)
#
# Template, not a finished machine config: serials are placeholders and a few
# values are per machine (reference_tare_counts, PID, input shaper). The real
# per-machine config lives host-side (coreone-host), never in this fork.
#
# Validated on a CORE One L+ (1.5GT belts): drivers, directions, sensorless
# homing in Prusa's order, load cell homing/probing (PROBE_ACCURACY std
# 0.004 mm), 9x9 bed mesh, accelerometer orientation and input shaping.
#
# Differences from the CORE One: 200-step XY motors (16 usteps, 0.5 A), Z
# 800 steps/mm, 300x300x338 volume, Y min -8, a diagonally mounted built-in
# accelerometer, and a mains bed on the AC Controller (CAN FD via the H503)
# -- there is NO bed heater/thermistor pin on the xBuddy for the L.
#
# Sources (Prusa-Firmware-Buddy, COREONEL, no INDX):
#   pins     src/common/hwio_pindef.h, Marlin pins_BUDDY_2209_02.h
#   motion   include/marlin/Configuration_COREONEL{,_adv}.h
#   hotend   tools_xbuddy.cpp (NTC table 2005, max 305 C), thermistor_2005.h
#            (104NT-4-R025H42G, 1000 ohm pull-up)
#   heatbreak thermistor_2008.h (100k B4267, 33k pull-up)
#   accel    lib/Marlin/Marlin/src/module/prusa/accelerometer.h
#   shaper   lib/Marlin/Marlin/src/feature/input_shaper/input_shaper_config.hpp
#   mesh     UBL 27-point grid, GRID_MAJOR_POINTS 9
#
# Homing follows Prusa's G28 for the L: Y first, then Y to 10 to clear the
# ventilation grille mechanism, then X, then Z with the load cell at the
# Z_SAFE_HOMING point -- see [homing_override].

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f427xx_XXXXXXXXXXXX-if00
baud: 115200
restart_method: command

# RS-485 to the H503 extension board: flashes and starts its Klipper app
# (PUPPY_START FILE=...), and keeps the extension port (PG2) powered.
# FIRMWARE_RESTART resets the F427 and cuts the H503's power; afterwards run
# PUPPY_START again before enabling [mcu extension] below.
[puppybus]
de_pin: PB7
baud: 230400
pwr_pin: PG2
reset_pin: PG8
read_timeout_us: 20000
gap_us: 2000

[printer] section overrides the "kinematics: none" there.
#
# Stages: 1 drivers/hotend, 2 moves, 3 homing, 4 probing and bed mesh,
# 5 input shaping (X MZV 56.6 Hz, Y MZV 41 Hz -- see README part P).
# Homing (stage 3) follows Prusa's G28 for the L: Y first, then Y to 10 to
# clear the ventilation grille mechanism, then X, then Z with the load cell
# at the Z_SAFE_HOMING point -- see [homing_override] at the end.
#
# Every value comes from Prusa-Firmware-Buddy for COREONEL (no INDX):
#   pins     src/common/hwio_pindef.h, Marlin pins_BUDDY_2209_02.h
#   motion   include/marlin/Configuration_COREONEL{,_adv}.h
#   hotend   tools_xbuddy.cpp (NTC table 2005, max 305 C), thermistor_2005.h
#            (104NT-4-R025H42G, 1000 ohm pull-up -- checked against the table)
#   heatbreak thermistor_2008.h (100k B4267, 33k pull-up -- checked likewise)

[printer]
kinematics: corexy
max_velocity: 300           # stock 500; raise after the first prints
max_accel: 5000             # stock 10000; the shaper limit for Y was ~5000
max_z_velocity: 15          # stock 15 mm/s
max_z_accel: 500            # stock 500 mm/s^2
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

# --- X/Y: 200-step motors, 16 usteps, 1.5GT belts ----------------------------
# Marlin INVERT_X/Y_DIR true -> "!" here. 2GT belts (non-plus): rotation_distance 32.
[stepper_x]
step_pin: PD7
dir_pin: !PD6
enable_pin: !PB9
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 31.5        # 1.5GT belts (CORE One L+): 101.587 steps/mm
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 302       # X homes to max (X_HOME_DIR 1); X_MAX_POS 302
position_min: -2
position_max: 302
homing_speed: 70             # HOMING_FEEDRATE_XY 70 mm/s
homing_retract_dist: 0

[tmc2130 stepper_x]
cs_pin: PG15
spi_bus: spi3a
diag1_pin: PG9
sense_resistor: 0.22        # X_RSENSE 0.22 -- without it Klipper assumes 0.110 and drives about half the current
run_current: 0.50           # X_CURRENT 500 mA (hold = run, HOLD_MULTIPLIER 1)
driver_SGT: 0               # X_STALL_SENSITIVITY 0
interpolate: True
driver_TOFF: 3              # CHOPPER_PRUSAMK3_24V {3, -2, 6}
driver_HSTRT: 5
driver_HEND: 1

[stepper_y]
step_pin: PD5
dir_pin: !PD4
enable_pin: !PB9
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 31.5        # 1.5GT belts (CORE One L+): 101.587 steps/mm
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: -8        # Y homes to min (Y_HOME_DIR -1); Y_MIN_POS -8
position_min: -8
position_max: 300           # Y_MAX_POS 300
homing_speed: 70             # HOMING_FEEDRATE_XY 70 mm/s
homing_retract_dist: 0

[tmc2130 stepper_y]
cs_pin: PB5
spi_bus: spi3a
diag1_pin: PE13
sense_resistor: 0.22
run_current: 0.50
driver_SGT: 0
interpolate: True
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 1

# --- Z: 800 steps/mm at 16 usteps -------------------------------------------
[stepper_z]
step_pin: PD3
dir_pin: PD2                # INVERT_Z_DIR false
enable_pin: !PB8
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 338           # DEFAULT_Z_MAX_POS 338
homing_speed: 5             # load cell homing; stock is 8 mm/s
second_homing_speed: 2
homing_retract_dist: 2

[tmc2130 stepper_z]
cs_pin: PF15
spi_bus: spi3a
sense_resistor: 0.22
run_current: 0.60           # Z_CURRENT 600 mA
interpolate: True
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 1

# --- Extruder / hotend ------------------------------------------------------
[extruder]
step_pin: PD1
dir_pin: PD0                # INVERT_E0_DIR false (no INDX)
enable_pin: !PD10
microsteps: 16
rotation_distance: 8        # 400 steps/mm (CALIBRATED_AXIS_STEPS_PER_UNIT_E0)
nozzle_diameter: 0.40
filament_diameter: 1.75
max_extrude_only_distance: 150
min_extrude_temp: 170       # EXTRUDE_MINTEMP
heater_pin: PB1
# Standard (NTC) hotend. The L can also have the high-temperature hotend
# with a PT1000 instead: then the nozzle reads about 150 C at room
# temperature with these settings, and the two lines below change to
# "sensor_type: PT1000" (pull-up stays 1000).
sensor_type: ATC Semitec 104NT-4-R025H42G
pullup_resistor: 1000
sensor_pin: PC0
# Measured on one L with PID_CALIBRATE HEATER=extruder TARGET=215; re-tune
# per machine. If this file is included, put the new values here: SAVE_CONFIG
# can't override values set in an included file.
control: pid
pid_Kp: 27.253
pid_Ki: 2.041
pid_Kd: 90.956
min_temp: 5                 # min_nozzle_temp 5
max_temp: 305               # max_nozzle_temp 305 (NTC hotend)

[tmc2130 extruder]
cs_pin: PF12
spi_bus: spi3a
diag1_pin: PD14
sense_resistor: 0.22
run_current: 0.45           # E0_CURRENT 450 mA
interpolate: True
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 1

# Heater power on the xBuddy is gated by this enable (PSU_ACTIVE_HIGH)
[output_pin heater_enable]
pin: PG10
value: 1
shutdown_value: 0

# Heatbreak NTC: shuts Klipper down above Buddy's HEATBREAK_MAXTEMP
[thermistor heatbreak_ntc]
temperature1: 25
resistance1: 100000
beta: 4267

[temperature_sensor heatbreak]
sensor_type: heatbreak_ntc
pullup_resistor: 33000
sensor_pin: PA6
min_temp: 0
max_temp: 100               # HEATBREAK_MAXTEMP

[temperature_sensor xbuddy]
sensor_type: temperature_mcu

[fan]
pin: PE11                   # print fan

[heater_fan heatbreak_fan]
pin: PE9
heater: extruder
heater_temp: 50

# --- Load cell (HX717): Z homing and probing from stage 3 -------------------
[load_cell_probe]
sensor_type: hx717
sclk_pin: PG1
dout_pin: PE7
data_ready_irq: True
z_offset: 0
speed: 3.0                  # probing speed, mm/s
lift_speed: 10
samples: 1
sample_retract_dist: 2
counts_per_gram: 52.083     # Buddy's default load cell scale, 0.0192 g/count
# Per machine: the raw reading with nothing touching the nozzle (filament
# loaded), from LOAD_CELL_DIAGNOSTIC / LOAD_CELL_TARE. It centres the +-2 kg
# safety band (force_safety_limit); a wrong value makes probing stop with
# "Trigger analog error: RAW_RANGE". One L read 473299.
reference_tare_counts: 0
# Pushing up on the nozzle lowers the raw reading
sensor_orientation: inverted

# --- Bed mesh (stage 4) -----------------------------------------------------
# Prusa probes 9 x 9 points on the L (GRID_MAJOR_POINTS 9 inside a 27-point
# UBL grid with a 1-point border): X/Y 11.5 .. 288.5 on the 300 x 300 bed.
# The nozzle is the probe, so there are no probe offsets.
[bed_mesh]
speed: 150
horizontal_move_z: 2
mesh_min: 11.5, 11.5
mesh_max: 288.5, 288.5
probe_count: 9, 9
algorithm: bicubic
fade_start: 1
fade_end: 10

# --- Built-in accelerometer (SPI2, CS PA10), diagonally mounted --------------
[lis3dh]
cs_pin: PA10
spi_bus: spi2a
# Checked with ACCELEROMETER_MEASURE during +X and +Y moves. Buddy's
# to_printer_coords suggests "-y, x, z" / -45, but that reverses Y;
# mirroring Y after the turn is the same as mirroring x and turning back:
axes_map: -y, -x, z
axes_rotation: 45

# --- Input shaping (stage 5) ---------------------------------------------------
[resonance_tester]
accel_chip: lis3dh
probe_points: 150, 150, 20

# Empty on purpose when this file is included: SHAPER_CALIBRATE + SAVE_CONFIG
# write the values into printer.cfg. Prusa's defaults for the L: MZV 56 Hz
# (X), MZV 42 Hz (Y). One L measured X 54 Hz -> MZV 56.6 Hz and a single Y
# peak at 40.7 Hz -> MZV 41 Hz. SHAPER_CALIBRATE recommended MZV 25.4 Hz for
# Y there, a poor fit that caps accel at 1800: check the Y spectrum.
[input_shaper]

# Sensorless homing needs push-pull DIAG outputs (from the Core One port)
[delayed_gcode set_diag_pushpull]
initial_duration: 1.0
gcode:
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_pushpull VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_pushpull VALUE=1

# --- Homing ------------------------------------------------------------------
# Prusa's order for the L (Configuration_COREONEL{,_adv}.h): HOME_Y_BEFORE_X,
# HOMING_PREEMPTIVE_MOVE_Y 10 before X, X/Y_CURRENT_HOME 550 mA,
# XY_HOMING_ACCELERATION 1250, HOMING_BACKOFF_POST_MM 2, Z at (270, 10).
# "G28 Z" alone needs X and Y homed first.
[homing_override]
axes: xyz
gcode:
    {% set th = printer.toolhead %}
    {% set all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set do_x = all or 'X' in params %}
    {% set do_y = all or 'Y' in params %}
    {% set do_z = all or 'Z' in params %}
    {% set cfg = printer.configfile.settings %}
    {% if do_z and not ((do_x or 'x' in th.homed_axes)
                        and (do_y or 'y' in th.homed_axes)) %}
      {action_raise_error("Home X and Y before Z (G28, or G28 X Y first)")}
    {% endif %}
    SAVE_GCODE_STATE NAME=homing_override
    G90
    # Lower the bed a little so the nozzle can't drag across it
    {% if 'z' not in th.homed_axes %}
      FORCE_MOVE STEPPER=stepper_z DISTANCE=3 VELOCITY=5
    {% elif th.position.z < 3 %}
      G1 Z3 F300
    {% endif %}
    {% if do_x or do_y %}
      SET_VELOCITY_LIMIT ACCEL=1250
      SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.55
      SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.55
    {% endif %}
    {% if do_y %}
      G28 Y
      G1 Y-6 F4200
    {% endif %}
    {% if do_x %}
      {% if do_y or 'y' in th.homed_axes %}
        G1 Y10 F4200
      {% endif %}
      # Let both motors settle first: StallGuard right after a move can
      # trip at once and "home" X wherever the head is (Klipper's
      # docs/TMC_Drivers.md recommends this pause between axes)
      G4 P2000
      G28 X
      G1 X300 F4200
    {% endif %}
    {% if do_x or do_y %}
      SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg['tmc2130 stepper_x'].run_current}
      SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg['tmc2130 stepper_y'].run_current}
      SET_VELOCITY_LIMIT ACCEL={th.max_accel}
    {% endif %}
    {% if do_z %}
      G1 X270 Y10 F6000
      G28 Z
      G1 Z5 F480
    {% endif %}
    RESTORE_GCODE_STATE NAME=homing_override

# --- Z motors stay powered, Z alignment --------------------------------------
# Buddy keeps the Z motors on all the time (Z_ALWAYS_ON): with them off, the
# bed can settle unevenly and tilt. "Motors off" (M84/M18, the Mainsail
# button, idle timeout) here releases X, Y and the extruder only.
[gcode_macro M84]
rename_existing: M84.1
description: Turn off the X, Y and extruder motors (Z stays on)
gcode:
    {% set z_homed = 'z' in printer.toolhead.homed_axes %}
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    SET_KINEMATIC_POSITION SET_HOMED={'z' if z_homed else 'none'} CLEAR_HOMED=xy

[gcode_macro M18]
rename_existing: M18.1
description: Same as M84
gcode:
    M84

# Prusa's "Z Alignment Calibration" (G162): drive the bed down onto its
# bottom stops and keep pushing, so each Z motor stops against its own stop
# and the bed ends up square to the frame. The motors skip loudly for about a
# second; that's expected.
[gcode_macro Z_ALIGN]
description: Square the bed to the frame by pushing it onto its bottom stops
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
      G28
    {% endif %}
    SAVE_GCODE_STATE NAME=z_align
    G90
    G1 X150 Y150 F6000
    G1 Z{printer.toolhead.axis_maximum.z - 10} F600
    M400
    # ~15 mm past the end of travel (Buddy pushes Z_MAX_POS + 15 at 15 mm/s)
    FORCE_MOVE STEPPER=stepper_z DISTANCE=25 VELOCITY=15 ACCEL=200
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-5 VELOCITY=10 ACCEL=200
    SET_KINEMATIC_POSITION CLEAR_HOMED=z
    G28 Z
    RESTORE_GCODE_STATE NAME=z_align

# --- Screen, jog wheel, touch (xLCD) ----------------------------------------
[display]
lcd_type: ili9488
encoder_pins: ^PD12, ^PD13
click_pin: ^!PG3

[gt911_touch]

# --- Belt tuning (Buddy manual_belt_tuning_config.hpp, COREONEL) -------------
# Vibrating lengths: top 311.5 mm, bottom 324.5 mm (avg 318 mm); target 25 N.
# Not yet tried on hardware.
#[belt_tune]
#sensor: accel
#measure_position: 294, 0
#belt_length_m: 0.318
#target_tension_n: 25

# --- Phase stepping (electrical period = 4 * rotation_distance / 200) --------
# Not yet tried on hardware.
#[phase_cogging]
#electrical_period: 0.63     # 1.5GT (31.5); 0.64 for 2GT (32)
#center_x: 150
#center_y: 150

# --- Mains bed via the AC Controller (CAN FD / Cyphal on the H503) -----------
# Enable after PUPPY_START has booted the H503 Klipper app (built from this
# fork, fdcan_raw.c) and its /dev/serial/by-id entry exists; then RESTART,
# not FIRMWARE_RESTART. The AC Controller regulates the bed itself.
#[mcu extension]
#serial: /dev/serial/by-id/usb-Klipper_stm32h503xx_XXXXXXXXXXXX-if00
#restart_method: command
#
#[ac_controller]
#rx_pin: extension:PB5          # FDCAN1 RX
#tx_pin: extension:PB6          # FDCAN1 TX
#enable_pin: !extension:PC15    # Buddy hal_pub "ENABLE", active low
#min_temp: 0
#max_temp: 120                  # Buddy BED_MAXTEMP 125 minus 5 safety margin
#status_timeout: 5              # no Status for this long while heating -> shutdown
#
# G-code: AC_STATUS, SET_AC_FAN FAN=bed|psu SPEED=0..1|auto,
#         SET_AC_LED RED= GREEN= BLUE= WHITE= [PROGRESS=] | OFF=1
