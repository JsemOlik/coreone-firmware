# Prusa CORE One L / L+ -- Phase-1 bring-up config (F427 xBuddy only, NO BED)
#
# Template, not a finished machine config: serials are placeholders, and the
# real per-machine config lives host-side (coreone-host), never in this fork.
#
# Sources for every value below (Prusa-Firmware-Buddy):
#   pins     src/common/hwio_pindef.h (XBUDDY), src/device/stm32f4/hal_msp.cpp
#   motion   include/marlin/Configuration_COREONEL{,_adv}.h
#   accel    lib/Marlin/Marlin/src/module/prusa/accelerometer.h (COREONEL)
#   shaper   lib/Marlin/Marlin/src/feature/input_shaper/input_shaper_config.hpp
#
# What differs from the CORE One: 200-step XY motors (16 usteps, 0.5 A),
# Z 800 steps/mm, 300x300x338 volume, Y min -8, built-in diagonally mounted
# accelerometer, and the bed is a mains bed on the AC Controller (CAN FD via
# the H503) -- there is NO bed heater/thermistor pin on the xBuddy for the L.
# The bed is added in Phase 2 ([ac_controller] on the extension MCU).
#
# Values marked VERIFY are derived from Buddy but not yet proven on hardware.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f427xx_XXXXXXXXXXXX-if00
baud: 115200
restart_method: command

[printer]
kinematics: corexy
max_velocity: 500           # Buddy max feedrate X/Y 500 mm/s
max_accel: 5000             # conservative bring-up value; raise after shaping
max_z_velocity: 15          # Buddy max feedrate Z 15 mm/s
max_z_accel: 500            # Buddy max accel Z 500 mm/s^2
square_corner_velocity: 5.0

[force_move]
enable_force_move: True

# --- XY: 200-step motors, 16 usteps, 2GT (rotation_distance 32) ------------
# 1.5GT belts: rotation_distance 31.5 (Buddy 101.587 steps/mm).  VERIFY belts.
[stepper_x]
step_pin: PD7
dir_pin: !PD6               # VERIFY: copied from Core One port
enable_pin: !PB9
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 32
endstop_pin: tmc2130_stepper_x:virtual_endstop
position_endstop: 302       # X homes to +X; VERIFY against frame (bed 300 wide)
position_min: -2
position_max: 302
homing_speed: 50
homing_retract_dist: 0      # required for sensorless

[tmc2130 stepper_x]
cs_pin: PG15
spi_bus: spi3a
diag1_pin: PG9
run_current: 0.50           # Buddy X_CURRENT 500 mA
driver_SGT: 0               # Buddy X_STALL_SENSITIVITY 0; retune live (SGT X=)
interpolate: True
driver_TOFF: 3              # CHOPPER_PRUSAMK3_24V
driver_HSTRT: 5
driver_HEND: 1

[stepper_y]
step_pin: PD5
dir_pin: !PD4               # VERIFY: copied from Core One port
enable_pin: !PB9
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 32
endstop_pin: tmc2130_stepper_y:virtual_endstop
position_endstop: -8        # Y homes to -Y; Buddy Y_MIN_POS -8
position_min: -8
position_max: 302           # VERIFY against frame
homing_speed: 50
homing_retract_dist: 0

[tmc2130 stepper_y]
cs_pin: PB5
spi_bus: spi3a
diag1_pin: PE13
run_current: 0.50
driver_SGT: 0
interpolate: True
driver_TOFF: 3
driver_HSTRT: 5
driver_HEND: 1

# --- Z: 800 steps/mm at 16 usteps -> rotation_distance 4 --------------------
[stepper_z]
step_pin: PD3
dir_pin: PD2                # VERIFY
enable_pin: !PB8
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 338           # Buddy DEFAULT_Z_MAX_POS
homing_speed: 8             # Buddy HOMING_FEEDRATE_Z 8 mm/s

[tmc2130 stepper_z]
cs_pin: PF15
spi_bus: spi3a
run_current: 0.60
interpolate: True

[safe_z_home]
home_xy_position: 270, 10   # Buddy Z_SAFE_HOMING point (L)
z_hop: 2
speed: 100

# --- Extruder / hotend ------------------------------------------------------
[extruder]
step_pin: PD1
dir_pin: PD0                # VERIFY
enable_pin: !PD10
microsteps: 16
rotation_distance: 8        # tune with E-steps cal (Buddy 380/400 steps/mm)
nozzle_diameter: 0.40
filament_diameter: 1.75
heater_pin: PB1
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC0             # Buddy TEMP_0 = PC0 (bring-up test cfgs say PA4: VERIFY)
control: pid
pid_Kp: 22
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150

[tmc2130 extruder]
cs_pin: PF12
spi_bus: spi3a
diag1_pin: PD14
run_current: 0.45
interpolate: True

# All heaters are gated by a hardware enable on the xBuddy.
[output_pin heater_enable]
pin: PG10
value: 1
shutdown_value: 0

[fan]
pin: PE11                   # print fan

[heater_fan heatbreak_fan]
pin: PE9
heater: extruder
heater_temp: 50

# --- Load cell (HX717): Z homing, probing, mesh -----------------------------
[load_cell_probe]
sensor_type: hx717
sclk_pin: PG1               # Buddy hx717Sck
dout_pin: PE7               # Buddy hx717Dout
data_ready_irq: True
z_offset: 0
speed: 3.0
counts_per_gram: 52.083
reference_tare_counts: 0    # calibrate: LOAD_CELL_CALIBRATE

[bed_mesh]
speed: 200
horizontal_move_z: 2
mesh_min: 10, 10
mesh_max: 290, 290
probe_count: 9, 9           # Buddy L mesh 9x9
algorithm: bicubic          # lagrange is limited to 6x6

# --- Built-in accelerometer (LIS2DH12 on SPI2: PB10/PC2/PC3, CS PA10) -------
# Mounted diagonally on the L head: Buddy's to_printer_coords is
#   X = (-s1 + s0)/sqrt2, Y = (s1 + s0)/sqrt2
# which is axes_map (-y, x, z) followed by a -45 deg rotation.
# VERIFY with ACCELEROMETER_QUERY while jogging +X then +Y.
[lis3dh]
cs_pin: PA10
spi_bus: spi2a
axes_map: -y, x, z
axes_rotation: -45

[resonance_tester]
accel_chip: lis3dh
probe_points: 150, 150, 20

[input_shaper]
shaper_type_x: mzv          # Buddy L defaults until SHAPER_CALIBRATE runs
shaper_freq_x: 56
shaper_type_y: mzv
shaper_freq_y: 42

# --- Sensorless-homing fix carried from the Core One port --------------------
[delayed_gcode set_diag_pushpull]
initial_duration: 1.0
gcode:
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_pushpull VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_pushpull VALUE=1

# --- Belt tuning (Buddy manual_belt_tuning_config.hpp, COREONEL) -------------
# Vibrating lengths: top 311.5 mm, bottom 324.5 mm (avg 318 mm); target 25 N.
[belt_tune]
sensor: accel               # the L has the accelerometer built in
measure_position: 294, 0
belt_length_m: 0.318
target_tension_n: 25

# --- Phase stepping (200-step XY: electrical period = 4 * 32/200 = 0.64 mm) --
# Enable only after plain stepping, homing and shaping are verified.
# The accelerometer is permanently mounted, so no removal step after cal.
#[phase_cogging]
#electrical_period: 0.64     # 0.63 for 1.5GT (rotation_distance 31.5)
#center_x: 150
#center_y: 150

# --- Phase 2: mains bed via the AC Controller (CAN FD / Cyphal on the H503) --
# Requires the H503 "extension" Klipper MCU built with this fork (fdcan_raw.c).
# UNVALIDATED ON HARDWARE: first bring-up with AC_STATUS, then a 60 C test with
# a hand on the power switch. The AC Controller regulates the bed itself.
#[mcu extension]
#serial: /dev/serial/by-id/usb-Klipper_stm32h503xx_XXXXXXXXXXXX-if00
#
#[ac_controller]
#rx_pin: extension:PB5          # FDCAN1 RX
#tx_pin: extension:PB6          # FDCAN1 TX
#enable_pin: !extension:PC15    # Buddy hal_pub "ENABLE", active low
#heater: heater_bed             # registered as a regular heater, gcode id B
#min_temp: 0
#max_temp: 120                  # Buddy BED_MAXTEMP 125 minus 5 safety margin
#target_tolerance: 1.5          # M190 / TEMPERATURE_WAIT settle band
#status_timeout: 5              # no Status for this long while heating -> shutdown
#config_refresh: 2              # re-send Config at least this often
#host_timeout: 3                # H503 leaves the bus if the host goes silent
#ignore_faults:                 # e.g. BED_FAN1_NOK (comma list); keep empty
#
# G-code: AC_STATUS, SET_AC_FAN FAN=bed|psu SPEED=0..1|auto,
#         SET_AC_LED RED= GREEN= BLUE= WHITE= [PROGRESS=] | OFF=1
